<title>LogNLoad Logging Flow</title>
<!--
  PROTOTYPE, throwaway. LogNLoad #12 "How does the logging screen flow?"
  Three structurally different in-Workout logging screens over one in-memory Workout:
  A Inline list, B Drill-down, C Focus. Switch with ?variant=A|B|C (local file) or #A|#B|#C (artifact),
  the floating bar, or the arrow keys. No persistence: reload to start over. Not production code.
-->
<style>
:root{
  --stage:#D8DCE2; --bg:#EEF0F3; --surface:#FFFFFF; --surface2:#F3F4F7; --text:#15171C; --muted:#646B78; --faint:#9CA2AD; --line:#DEE1E7;
  --accent:#1E5BC6; --on-accent:#FFFFFF; --accent-soft:#E4ECFA;
  --done:#1D8750; --on-done:#FFFFFF; --done-soft:#E1F3E8;
  --warm:#9A7300; --warm-soft:#FBF0C8;
  --danger:#C8322B; --on-danger:#FFFFFF;
  --edit:#6441D2; --on-edit:#FFFFFF; --edit-soft:#EEE9FC;
  --scrim:rgba(12,14,18,.38); --frame:#1B1D22; --frame-edge:#3A3D44;
  --proto-bg:#111317; --proto-ink:#F4F5F7;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --bar-space:72px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#050608; --bg:#0C0E11; --surface:#171A1F; --surface2:#20242B; --text:#ECEEF2; --muted:#9BA3B0; --faint:#626A76; --line:#2A2F37;
    --accent:#6F9CFF; --on-accent:#0B0F18; --accent-soft:#1B2944;
    --done:#45C285; --on-done:#06140C; --done-soft:#132C1D;
    --warm:#EDC53C; --warm-soft:#322A0D;
    --danger:#FF6B5F; --on-danger:#1A0605;
    --edit:#A68CFF; --on-edit:#140C2E; --edit-soft:#231C40;
    --scrim:rgba(0,0,0,.58); --frame:#1B1D22; --frame-edge:#34373E;
    --proto-bg:#F4F5F7; --proto-ink:#111317;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#050608; --bg:#0C0E11; --surface:#171A1F; --surface2:#20242B; --text:#ECEEF2; --muted:#9BA3B0; --faint:#626A76; --line:#2A2F37;
  --accent:#6F9CFF; --on-accent:#0B0F18; --accent-soft:#1B2944;
  --done:#45C285; --on-done:#06140C; --done-soft:#132C1D;
  --warm:#EDC53C; --warm-soft:#322A0D;
  --danger:#FF6B5F; --on-danger:#1A0605;
  --edit:#A68CFF; --on-edit:#140C2E; --edit-soft:#231C40;
  --scrim:rgba(0,0,0,.58); --frame:#1B1D22; --frame-edge:#34373E;
  --proto-bg:#F4F5F7; --proto-ink:#111317;
  color-scheme:dark;
}
@media (min-width:860px){ :root{ --bar-space:0px; } }

html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font:15px/1.35 var(--sys);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--faint)}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0}

#stage{height:100%;display:flex;justify-content:center;align-items:center;gap:32px;box-sizing:border-box}
#phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);font-variant-numeric:tabular-nums}
#app{height:100%}
@media (min-width:860px){
  #stage{padding-block:24px 84px}
  #phone{width:390px;flex:none;height:min(844px,100%);border-radius:46px;box-shadow:0 0 0 11px var(--frame),0 0 0 12px var(--frame-edge),0 40px 80px -20px rgba(0,0,0,.35)}
  #phone .nav{padding-top:20px}
  #phone .scr > .scroll:first-child{padding-top:32px}
  #phone .b-toolbar{padding:10px 28px 22px}
  #phone .sheet{padding-bottom:28px}
  #phone .actsheet{padding-bottom:24px}
}
@media (pointer:coarse){ .entrynote,.field,.a-snote input,.eb-f input,.b-note,.a-wnote{font-size:16px} }

/* ---------- shared app chrome ---------- */
.scr{display:flex;flex-direction:column;height:100%;position:relative}
.nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:6px 16px;background:var(--bg);border-bottom:1px solid var(--line);box-sizing:border-box}
.nav-l{justify-self:start;display:flex;align-items:center}
.nav-t{justify-self:center;font-weight:650}
.nav-r{justify-self:end;display:flex;align-items:center}
.navbtn{color:var(--accent);font-size:16px;padding:8px 2px;display:inline-flex;align-items:center;gap:2px}
.navbtn.strong{font-weight:700}
.navbtn.danger{color:var(--danger)}
.pillbtn{background:var(--done);color:var(--on-done);font-weight:650;padding:7px 16px;border-radius:999px}
.editing .nav{background:var(--edit-soft);border-bottom-color:color-mix(in srgb,var(--edit) 30%,transparent)}
.editing .navbtn{color:var(--edit)}
.nav-edit{color:var(--edit);font-weight:700}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px calc(28px + var(--bar-space));display:flex;flex-direction:column;gap:12px}
.scroll.has-toolbar{padding-bottom:28px}
.scroll > *{flex-shrink:0}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.iconbtn:disabled{opacity:.3;cursor:default}
.exnote{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--muted)}
.exnote svg{flex:none;margin-top:2px}
.entrynote,.field{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;resize:vertical;font-size:14px}
.status{font-size:12px;font-weight:650;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.status.ok{background:var(--done-soft);color:var(--done)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.on.warm{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}
.btn{padding:13px 16px;border-radius:14px;background:var(--surface2);font-weight:650;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary.done{background:var(--done);color:var(--on-done)}
.btn.danger-text{background:none;color:var(--danger)}
.btn.ghost{background:none;color:var(--muted)}
.btn.xl{padding:18px;font-size:18px;border-radius:18px}
.lbl{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);flex:none}
.lbl.warm{background:var(--warm-soft);color:var(--warm)}
.muted{color:var(--muted)}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}

.editbar{background:var(--edit-soft);border:1px solid color-mix(in srgb,var(--edit) 25%,transparent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.eb-row{display:flex;align-items:center;gap:8px;font-weight:650}
.eb-tag{background:var(--edit);color:var(--on-edit);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.eb-times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eb-f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.eb-f input,.editbar .field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;min-width:0;width:100%;box-sizing:border-box}
.eb-hint{font-size:12px;color:var(--muted)}

/* steppers, switch, segmented */
.stp{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stp-l{font-weight:600}
.stp-l span{color:var(--muted);font-weight:500;font-size:13px}
.stp-c{display:flex;align-items:center;gap:6px}
.stp-b{width:44px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--accent)}
.stp-in{width:84px;height:40px;box-sizing:border-box;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:700 18px var(--round)}
.stp.big{flex-direction:column;align-items:stretch;gap:6px}
.stp.big .stp-l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stp.big .stp-l span{text-transform:none;letter-spacing:0}
.stp.big .stp-c{justify-content:space-between}
.stp.big .stp-b{width:64px;height:64px;border-radius:20px}
.stp.big .stp-in{flex:1;min-width:0;height:64px;font-size:38px;border:0;background:none}
.switch{width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--warm)}
.switch.on span{transform:translateX(20px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:10px;padding:2px}
.seg button{padding:8px 0;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column}
.ov.bottom{justify-content:flex-end}
.ov.center{justify-content:center;align-items:center;padding:24px}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--bar-space));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto;box-sizing:border-box;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.tall{height:86%;overflow:hidden}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-kicker{font-size:13px;color:var(--muted)}
.sh-title{font-size:20px;font-weight:750;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-sub{font-size:13px;color:var(--muted);margin-top:-6px}
.sh-actions{display:flex;flex-direction:column;gap:8px}
.alert{position:relative;width:min(290px,100%);background:var(--surface);border-radius:16px;overflow:hidden;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.al-t{font-weight:700;font-size:17px;padding:18px 16px 4px;text-wrap:balance}
.al-m{font-size:14px;color:var(--muted);padding:2px 16px 16px;line-height:1.4}
.al-btns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.al-btns.one,.al-btns.stack{grid-template-columns:1fr}
.al-b{padding:12px;color:var(--accent);font-size:16px}
.al-btns:not(.stack) .al-b+.al-b{border-left:1px solid var(--line)}
.al-btns.stack .al-b+.al-b{border-top:1px solid var(--line)}
.al-b.destructive{color:var(--danger)}
.al-b.strong,.al-b.cancel{font-weight:700}
.actsheet{position:relative;padding:8px 10px calc(10px + var(--bar-space));display:flex;flex-direction:column;gap:8px}
.as-group{background:var(--surface);border-radius:14px;overflow:hidden}
.as-t{font-size:13px;color:var(--muted);text-align:center;padding:12px;border-bottom:1px solid var(--line)}
.as-b{display:block;width:100%;padding:15px;font-size:17px;color:var(--accent);text-align:center}
.as-group .as-b+.as-b{border-top:1px solid var(--line)}
.as-b.destructive{color:var(--danger)}
.as-cancel{background:var(--surface);border-radius:14px;font-weight:700}
.pk-q{border:0;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:16px}
.pk-list{flex:1;overflow-y:auto;margin:0 -16px;padding:0 16px}
.pk-sec{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px}
.pk-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.pk-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pk-name{font-weight:600}
.pk-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.pk-none{color:var(--muted);padding:20px 0;text-align:center}
.fin-stats{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}
.fin-stats div{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.fin-stats b{font:700 20px var(--round)}
.fin-stats span{font-size:12px;color:var(--muted)}
.fin-warn{font-size:14px;background:var(--warm-soft);padding:10px 12px;border-radius:12px}
.fin-end{display:flex;flex-direction:column;gap:8px;font-size:14px}
.fin-fine{font-size:12px;color:var(--muted);text-align:center}
#toast{position:absolute;top:70px;left:16px;right:16px;z-index:30;display:flex;justify-content:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}

/* ---------- A: inline list ---------- */
.a-timer{font:600 16px var(--round);color:var(--muted)}
.a-wname{font-size:24px;font-weight:750;border:0;background:none;padding:0;width:100%}
.a-wnote{border:0;background:none;resize:none;color:var(--muted);padding:0;width:100%;margin-top:-8px}
.a-card{background:var(--surface);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.a-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.a-exname{color:var(--accent);font-weight:700;font-size:17px;text-align:left}
.a-last{font-size:12px;color:var(--faint)}
.a-grid{display:grid;grid-template-columns:36px 1fr 1fr 44px 44px;gap:6px;align-items:center}
.a-grid.noc{grid-template-columns:36px 1fr 1fr 44px}
.a-cols{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:4px 4px 0}
.a-cols span:nth-child(n+2){text-align:center}
.swipe{position:relative;overflow:hidden;border-radius:10px;touch-action:pan-y}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:88px;background:var(--danger);color:var(--on-danger);font-weight:650}
.a-row{position:relative;background:var(--surface);padding:4px;transition:transform .18s ease}
.swipe.revealed .a-row{transform:translateX(-88px)}
.a-row.done{background:var(--done-soft)}
.a-lbl{height:34px;border-radius:8px;background:var(--surface2);font-weight:700;color:var(--muted)}
.a-row.warm .a-lbl{background:var(--warm-soft);color:var(--warm)}
.a-in{width:100%;min-width:0;box-sizing:border-box;height:34px;text-align:center;border:0;border-radius:8px;background:var(--surface2);font-weight:650;font-size:16px}
.a-row.target .a-in{color:var(--muted);font-weight:500}
.a-row.done .a-in{background:transparent}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.a-rir{height:34px;border-radius:8px;font-size:13px;color:var(--faint);font-weight:650}
.a-rir.has{color:var(--text);background:var(--surface2)}
.a-check{height:34px;border-radius:8px;background:var(--surface2);color:var(--faint);display:grid;place-items:center}
.a-row.done .a-check{background:var(--done);color:var(--on-done)}
.rir{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.a-rirrow{padding:6px 4px 2px 46px}
.rir-q{font-size:12px;color:var(--muted);margin-right:2px}
.a-snote{display:flex;gap:6px;align-items:center;padding:2px 4px 2px 46px;color:var(--muted)}
.a-snote input{flex:1;min-width:0;border:0;background:none;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.a-addset{padding:8px;border-radius:10px;background:var(--surface2);color:var(--accent);font-weight:650;display:flex;gap:6px;justify-content:center;align-items:center;margin-top:4px}
.a-addex{padding:14px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);font-weight:700;display:flex;justify-content:center;align-items:center;gap:8px}
.a-discard{color:var(--danger);padding:12px;font-weight:600}
.a-empty{font-size:13px;color:var(--muted);padding:6px 4px}
.a-reorder{background:var(--surface);border-radius:16px;padding:6px 12px}
.a-rhead{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-weight:700}
.a-rrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.a-rbtns{display:flex;gap:4px}

/* ---------- B: drill-down ---------- */
.b-title{font-size:30px;font-weight:800;letter-spacing:-.01em;border:0;background:none;padding:0;width:100%}
.b-sub{color:var(--muted);font-size:14px;margin-top:-8px;display:flex;align-items:center;gap:6px}
.dot{width:3px;height:3px;border-radius:50%;background:currentColor;display:inline-block}
.b-group{background:var(--surface);border-radius:14px;overflow:hidden;flex:none}
.b-grouplabel{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px 0;margin-bottom:-6px}
.b-row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:50px;box-sizing:border-box;cursor:pointer}
.b-row+.b-row,.b-row+.b-emptyrow,.b-emptyrow+.b-row{border-top:1px solid var(--line)}
.b-rowmain{flex:1;min-width:0}
.b-name{font-weight:650}
.b-meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-chev{color:var(--faint);display:grid}
.b-addrow{color:var(--accent);font-weight:650}
.b-emptyrow{padding:14px;color:var(--muted);font-size:14px}
.ring{position:relative;width:32px;height:32px;flex:none}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}
.b-count{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.b-note{width:100%;box-sizing:border-box;border:0;padding:12px 14px;resize:vertical;background:none;display:block}
.b-toolbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px calc(10px + var(--bar-space));background:var(--bg);border-top:1px solid var(--line)}
.tb{color:var(--accent);font-weight:600;padding:6px 2px}
.tb.strong{font-weight:750}
.tb-sum{font-size:12px;color:var(--muted)}
.b-exname{font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.b-exmeta{font-size:13px;color:var(--muted);margin-top:-8px}
.b-last{font-size:13px;background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.b-lastlbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650}
.b-entrynote{background:var(--surface)}
.b-setval{flex:1;font-weight:650;font-size:16px;min-width:0}
.b-setrow.target .b-setval{color:var(--muted);font-weight:500}
.b-hasnote{color:var(--muted);vertical-align:-2px}
.b-rirv{font-size:12px;color:var(--muted)}
.b-circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;box-sizing:border-box}
.b-setrow.done .b-circle{background:var(--done);border-color:var(--done);color:var(--on-done)}
.b-time{font-size:12px;color:var(--faint)}
.b-next{display:flex;align-items:center;gap:10px;padding:14px;background:var(--accent-soft);color:var(--accent);border-radius:14px;font-weight:650;text-align:left}
.b-next .b-nextlbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.b-next .b-nextname{flex:1}
.b-plain{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;color:var(--edit);font-weight:650;background:var(--edit-soft);border-radius:14px}
.b-danger{color:var(--danger);font-weight:600;padding:12px}

<div id="stage">
  <div id="phone"><div id="app"></div><div id="overlay"></div><div id="toast"></div></div>

<script>
/* =====================================================================
   Model: pure functions over plain data. No DOM in here.
   ===================================================================== */
let _n = 0;
const uid = () => 'i' + (++_n).toString(36);
const MIN = 60e3;
const T = (y, mo, d, h, mi) => new Date(y, mo - 1, d, h, mi).getTime();

const pad = n => String(n).padStart(2, '0');
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtTime = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDate = t => { const d = new Date(t); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const fmtDur = ms => { const m = Math.round(ms / MIN); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min'; };
const fmtClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + ':' + pad(m) + ':' + pad(s % 60) : m + ':' + pad(s % 60); };
const kg = w => String(Math.round(w * 100) / 100);

const M = {
  convention: ex => ['Dumbbell', 'Kettlebell'].includes(ex.equipment) ? 'each' : 'total',
  compatible: (a, b) => a.id !== b.id && a.loadType === b.loadType && a.unilateral === b.unilateral && M.convention(a) === M.convention(b),
  ex: (db, id) => db.exercises.find(x => x.id === id),
  active: db => db.workouts.find(w => w.endedAt == null) || null,
  working: db => db.edit ? db.edit.draft : M.active(db),
  entry: (w, id) => w ? w.entries.find(e => e.id === id) : null,
  findSet: (db, eid, sid) => { const e = M.entry(M.working(db), eid); return e ? e.sets.find(s => s.id === sid) : null; },
  // A Set is a target only in the Active Workout. In a finished Workout an empty completedAt means "time unknown".
  isTarget: (db, s) => !db.edit && s.completedAt == null,
  finishedWorkouts: db => db.workouts.filter(w => w.endedAt != null).sort((a, b) => b.startedAt - a.startedAt),
  lastPerformance(db, exId) {
    for (const w of M.finishedWorkouts(db)) { const e = w.entries.find(e => e.exerciseId === exId); if (e) return { workout: w, sets: e.sets }; }
    return null;
  },
  blankSet: () => ({ id: uid(), weight: 0, reps: 0, repsLeft: 0, repsRight: 0, rir: null, isWarmUp: false, note: '', completedAt: null }),
  copyAsTarget: s => ({ ...M.blankSet(), weight: s.weight, reps: s.reps, repsLeft: s.repsLeft, repsRight: s.repsRight, isWarmUp: s.isWarmUp }),

  addExercise(db, exId) {
    const w = M.working(db);
    const existing = w.entries.find(e => e.exerciseId === exId);
    if (existing) return { entryId: existing.id, existed: true };
    const lp = db.edit ? null : M.lastPerformance(db, exId);
    const e = { id: uid(), exerciseId: exId, note: '', sets: lp ? lp.sets.map(M.copyAsTarget) : [M.blankSet()] };
    w.entries.push(e);
    return { entryId: e.id, existed: false, prefilled: !!lp };
  },
  complete(db, eid, sid) { M.findSet(db, eid, sid).completedAt = db.now; },
  uncomplete(db, eid, sid) { M.findSet(db, eid, sid).completedAt = null; },
  setField(db, eid, sid, f, v) { M.findSet(db, eid, sid)[f] = v; },
  step(db, eid, sid, f, d) {
    const s = M.findSet(db, eid, sid);
    s[f] = f === 'weight' ? Math.max(0, Math.round((s[f] + d) * 100) / 100) : Math.max(0, s[f] + d);
  },
  addSet(db, eid) {
    const e = M.entry(M.working(db), eid);
    const prev = e.sets.filter(s => !s.isWarmUp).at(-1) || e.sets.at(-1);
    const s = prev ? M.copyAsTarget(prev) : M.blankSet();
    s.isWarmUp = false;
    e.sets.push(s);
    return s.id;
  },
  removeSet(db, eid, sid) { const e = M.entry(M.working(db), eid); e.sets = e.sets.filter(s => s.id !== sid); },
  move(arr, i, d) { const j = i + d; if (i < 0 || j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; },
  moveSet(db, eid, sid, d) { const e = M.entry(M.working(db), eid); M.move(e.sets, e.sets.findIndex(s => s.id === sid), d); },
  moveEntry(db, eid, d) { const w = M.working(db); M.move(w.entries, w.entries.findIndex(e => e.id === eid), d); },
  removeEntry(db, eid) { const w = M.working(db); w.entries = w.entries.filter(e => e.id !== eid); },
  entryNote(db, eid, t) { M.entry(M.working(db), eid).note = t; },
  workoutField(db, f, v) { M.working(db)[f] = v; },
  swap(db, eid, exId) {
    const w = M.working(db), i = w.entries.findIndex(e => e.id === eid), e = w.entries[i];
    const j = w.entries.findIndex(x => x.exerciseId === exId);
    if (j < 0) { e.exerciseId = exId; return { combined: false, entryId: e.id }; }
    const other = w.entries[j];
    const combined = { id: other.id, exerciseId: exId, note: [other.note, e.note].filter(Boolean).join('\n'), sets: [...other.sets, ...e.sets] };
    const pos = Math.min(i, j);
    w.entries = w.entries.filter((_, k) => k !== i && k !== j);
    w.entries.splice(pos, 0, combined);
    return { combined: true, entryId: combined.id };
  },

  start(db) { const w = { id: uid(), name: '', note: '', startedAt: db.now, endedAt: null, entries: [] }; db.workouts.push(w); return w.id; },
  lastSetAt(w) { let t = null; for (const e of w.entries) for (const s of e.sets) if (s.completedAt != null && (t == null || s.completedAt > t)) t = s.completedAt; return t; },
  finishCheck(db) {
    const w = M.active(db); let completed = 0, targets = 0; const dropped = [];
    for (const e of w.entries) { const c = e.sets.filter(s => s.completedAt != null).length; completed += c; targets += e.sets.length - c; if (!c) dropped.push(e); }
    const lastAt = M.lastSetAt(w);
    return { completed, targets, dropped, lastAt, exercises: w.entries.length - dropped.length, needsEndPrompt: lastAt != null && db.now - lastAt > 15 * MIN };
  },
  finish(db, endAt) {
    const w = M.active(db);
    w.entries = w.entries.map(e => ({ ...e, sets: e.sets.filter(s => s.completedAt != null) })).filter(e => e.sets.length);
    w.endedAt = endAt;
    db.health.push(M.label(db, w) + ': saved to Health, ' + fmtTime(w.startedAt) + ' to ' + fmtTime(endAt));
    return w.id;
  },
  discard(db) { db.workouts = db.workouts.filter(w => w.endedAt != null); },
  staleCheck(db) {
    const w = M.active(db); if (!w) return null;
    const lastAt = M.lastSetAt(w), ref = lastAt ?? w.startedAt;
    return db.now - ref > 3 * 60 * MIN ? { lastAt, ref } : null;
  },
  beginEdit(db, wid) { const w = db.workouts.find(x => x.id === wid); db.edit = { draft: structuredClone(w), original: structuredClone(w) }; },
  editChanged: db => JSON.stringify(db.edit.draft) !== JSON.stringify(db.edit.original),
  overlaps: (a, b, now) => a.startedAt < (b.endedAt ?? now) && b.startedAt < (a.endedAt ?? now),
  editDoneCheck(db) {
    const d = db.edit.draft, o = db.edit.original;
    if (!(d.endedAt > d.startedAt)) return { error: 'The end time must be after the start time.' };
    if (d.endedAt > db.now) return { error: "The end time can't be in the future." };
    const other = db.workouts.find(w => w.id !== d.id && M.overlaps(d, w, db.now));
    if (other) return { error: 'overlap', other };
    if (!d.entries.some(e => e.sets.length)) return { empty: true };
    return { ok: true, timesChanged: d.startedAt !== o.startedAt || d.endedAt !== o.endedAt };
  },
  commitEdit(db) {
    const d = db.edit.draft, o = db.edit.original;
    const timesChanged = d.startedAt !== o.startedAt || d.endedAt !== o.endedAt;
    d.entries = d.entries.filter(e => e.sets.length);
    db.workouts = db.workouts.map(w => w.id === d.id ? d : w);
    if (timesChanged) db.health.push(M.label(db, d) + ': times rewritten in Health (same sync identifier)');
    db.edit = null;
    return { timesChanged };
  },
  cancelEdit(db) { db.edit = null; },
  deleteWorkout(db, wid) {
    const w = db.workouts.find(x => x.id === wid);
    if (w) db.health.push(M.label(db, w) + ': deleted from Health');
    db.workouts = db.workouts.filter(x => x.id !== wid);
    if (db.edit && db.edit.draft.id === wid) db.edit = null;
  },
  label(db, w) {
    return (w.name || '').trim() || fmtDate(w.startedAt) + ', ' + (w.entries.slice(0, 2).map(e => M.ex(db, e.exerciseId).name).join(', ') || 'no Exercises');
  },
};

/* =====================================================================
   Seed data: the 74 starter Exercises and some finished Workouts
   ===================================================================== */
const EQ = { M: 'Machine', D: 'Dumbbell', C: 'Cable', X: 'Barbell', W: 'Bodyweight' };
const LT = { L: 'Loaded', B: 'Bodyweight', A: 'Assisted' };
const SEEDS = `Incline Chest Press (Hoist)|M|L|0;Incline Chest Press (Hammer Strength)|M|L|0;Incline Chest Press (Nautilus)|M|L|0;Chest Press (Hoist)|M|L|0;Chest Press (Hammer Strength)|M|L|0;Chest Press (Nautilus)|M|L|0;Chest Press (Star Trac)|M|L|0;Chest Fly (Nautilus)|M|L|0;
Lateral Raise (Nautilus)|M|L|0;Seated DB Lateral Raise|D|L|0;Single-Arm Cable Lateral Raise|C|L|1;Shoulder Press (Hoist)|M|L|0;Shoulder Press (Hammer Strength)|M|L|0;Shoulder Press (Nautilus)|M|L|0;Shoulder Press (Star Trac)|M|L|0;Reverse Fly (Nautilus)|M|L|0;Face Pull|C|L|0;Cable Upright Row|C|L|0;Barbell Upright Row|X|L|0;Cable External Rotation at Side|C|L|1;Cable Internal Rotation at Side|C|L|1;Prone Incline Y Raise|D|L|0;
Lat Pulldown (Hoist)|M|L|0;Lat Pulldown (Hammer Strength)|M|L|0;Lat Pulldown (Nautilus)|M|L|0;Lat Pulldown (Star Trac)|M|L|0;Cable Lat Pulldown|C|L|0;Lat Prayer|C|L|0;Assisted Pull-Up (Nautilus)|M|A|0;High Row (Hammer Strength)|M|L|0;Seated Row (Hammer Strength)|M|L|0;Seated Row (Hoist)|M|L|0;Seated Row (Nautilus)|M|L|0;Seated Row (Star Trac)|M|L|0;Cable Close-Grip Seated Row|C|L|0;Cable Wide-Grip Seated Row|C|L|0;Barbell Row|X|L|0;Pullover (Nautilus)|M|L|0;Back Extension (Nautilus)|M|L|0;Deadlift|X|L|0;
Close-Grip EZ Preacher Curl|X|L|0;DB Preacher Curl|D|L|1;Biceps Curl (Nautilus)|M|L|0;Incline Biceps Curl (Nautilus)|M|L|0;Lying DB Curl|D|L|0;Bayesian Curl|C|L|1;Cable Curl With Bar|C|L|0;EZ Curl|X|L|0;Concentration Curl|D|L|1;Hammer Curl|D|L|0;DB Wrist Curl|D|L|0;DB Wrist Extension|D|L|0;
Triceps Pushdown With Bar|C|L|0;Triceps Pushdown With Rope|C|L|0;Seated DB French Press|D|L|0;Seated Single-Arm DB French Press|D|L|1;Triceps Extension (Nautilus)|M|L|0;Lying EZ Triceps Extension|X|L|0;Assisted Dip (Nautilus)|M|A|0;Dip Machine (Nautilus)|M|L|0;
Leg Press (Hammer Strength)|M|L|0;Seated Leg Press (Nautilus)|M|L|0;Hack Squat (Hammer Strength)|M|L|0;Squat|X|L|0;Air Squat|W|B|0;DB Walking Lunge|D|L|1;Bodyweight Lunge|W|B|1;Leg Extension (Nautilus)|M|L|0;Seated Leg Curl (Nautilus)|M|L|0;Lying Leg Curl (Nautilus)|M|L|0;Romanian Deadlift|X|L|0;Hip Adduction (Nautilus)|M|L|0;Hip Abduction (Nautilus)|M|L|0;Standing Calf Raise (Nautilus)|M|L|0`;
const EX_NOTES = { 'Incline Chest Press (Hoist)': 'Seat 5, back pad 2', 'Shoulder Press (Hoist)': 'Seat 4', 'Lat Pulldown (Hoist)': 'Knee pad 3' };

// [name, [y,mo,d,h,mi], minutes, [[exercise, [[kg, reps or [L,R], flags...]]]]], flag 'w' = warm-up, number = RIR
const HISTORY = [
  ['Pull', [2026, 9, 22, 18, 0], 65, [
    ['Lat Pulldown (Hoist)', [[35, 10, 'w'], [65, 10], [65, 9], [65, 8, 1]]],
    ['Seated Row (Hammer Strength)', [[70, 10], [70, 10], [70, 9, 2]]],
    ['Face Pull', [[20, 15], [20, 15], [20, 14]]],
    ['DB Preacher Curl', [[12, [10, 10]], [12, [9, 8], 1]]],
    ['Hammer Curl', [[14, 12], [14, 11], [14, 10, 0]]],
  ]],
  ['Arms', [2026, 9, 24, 7, 0], 50, [
    ['Close-Grip EZ Preacher Curl', [[20, 12], [25, 10], [25, 9, 1]]],
    ['Triceps Pushdown With Bar', [[30, 12], [30, 11], [30, 10]]],
    ['Cable Curl With Bar', [[25, 12], [25, 11, 0]]],
  ]],
  ['Push', [2026, 9, 24, 17, 30], 70, [
    ['Incline Chest Press (Hoist)', [[30, 10, 'w'], [60, 10], [60, 9], [60, 8, 1]]],
    ['Shoulder Press (Hoist)', [[40, 10], [40, 9], [40, 8, 1]]],
    ['Seated DB Lateral Raise', [[10, 14], [10, 12], [10, 12, 0]]],
    ['Triceps Pushdown With Rope', [[25, 12], [25, 12], [25, 11]]],
    ['Assisted Dip (Nautilus)', [[30, 10], [30, 9, 2]]],
  ]],
  ['Legs', [2026, 9, 26, 10, 0], 70, [
    ['Squat', [[60, 8, 'w'], [100, 6], [100, 6], [100, 5, 1]]],
    ['Romanian Deadlift', [[90, 8], [90, 8], [90, 8, 2]]],
    ['DB Walking Lunge', [[16, [10, 10]], [16, [10, 9], 1]]],
    ['Seated Leg Curl (Nautilus)', [[45, 12], [45, 12], [45, 11]]],
  ]],
];

function mkSet([w, reps, ...flags], at) {
  const s = { ...M.blankSet(), weight: w, completedAt: at == null ? null : Math.round(at / MIN) * MIN };
  if (Array.isArray(reps)) { s.repsLeft = reps[0]; s.repsRight = reps[1]; } else s.reps = reps;
  for (const f of flags) { if (f === 'w') s.isWarmUp = true; else if (typeof f === 'number') s.rir = f; }
  return s;
}
function buildDb(scenario) {
  const exercises = SEEDS.split(';').map((row, i) => {
    const [name, eq, lt, uni] = row.trim().split('|');
    return { id: 'x' + i, name, equipment: EQ[eq], loadType: LT[lt], unilateral: uni === '1', note: EX_NOTES[name] || '', archived: false };
  });
  const byName = n => exercises.find(e => e.name === n);
  const workouts = HISTORY.map(([name, when, dur, ents]) => {
    const start = T(...when), total = ents.reduce((n, e) => n + e[1].length, 0), step = (dur - 6) * MIN / total;
    let k = 0;
    return { id: uid(), name, note: '', startedAt: start, endedAt: start + dur * MIN,
      entries: ents.map(([xn, sets]) => ({ id: uid(), exerciseId: byName(xn).id, note: '', sets: sets.map(sp => mkSet(sp, start + 3 * MIN + (++k) * step)) })) };
  });
  const db = { now: T(2026, 9, 28, 17, 52), exercises, workouts, edit: null, health: [] };
  if (scenario === 'mid') {
    const icp = byName('Incline Chest Press (Hoist)'), sp = byName('Shoulder Press (Hoist)');
    db.workouts.push({ id: uid(), name: '', note: '', startedAt: T(2026, 9, 28, 17, 30), endedAt: null, entries: [
      { id: uid(), exerciseId: icp.id, note: '', sets: [mkSet([30, 10, 'w'], T(2026, 9, 28, 17, 36)), mkSet([62.5, 10], T(2026, 9, 28, 17, 41)), mkSet([62.5, 9, 1], T(2026, 9, 28, 17, 46)), mkSet([60, 8], null)] },
      { id: uid(), exerciseId: sp.id, note: '', sets: [mkSet([40, 10], null), mkSet([40, 9], null), mkSet([40, 8], null)] },
    ] });
  }
  return db;
}

/* =====================================================================
   Page shell: helpers shared by every variant
   ===================================================================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toInput = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const unit = ex => ex.loadType === 'Bodyweight' ? '+kg' : ex.loadType === 'Assisted' ? 'assist kg' : M.convention(ex) === 'each' ? 'kg each' : 'kg';
const repsTxt = (ex, s) => ex.unilateral ? s.repsLeft + '/' + s.repsRight : String(s.reps);
const wTxt = (ex, s) => ex.loadType === 'Bodyweight' ? (s.weight > 0 ? 'BW+' + kg(s.weight) + ' kg' : 'BW') : ex.loadType === 'Assisted' ? kg(s.weight) + ' kg assist' : kg(s.weight) + ' kg';
const setTxt = (ex, s) => wTxt(ex, s) + ' x ' + repsTxt(ex, s);
const rirTxt = r => r == null ? '' : r === 4 ? 'Easy' : String(r);
const labels = e => { let n = 0; return e.sets.map(s => s.isWarmUp ? 'W' : String(++n)); };
function compact(ex, sets) {
  const out = []; let cur = null;
  for (const s of sets) {
    const w = wTxt(ex, s);
    if (cur && !s.isWarmUp && !cur.warm && cur.w === w) cur.reps.push(repsTxt(ex, s));
    else { cur = { w, warm: s.isWarmUp, reps: [repsTxt(ex, s)] }; out.push(cur); }
  }
  return out.map(g => (g.warm ? 'W ' : '') + g.w + ' x ' + g.reps.join(', ')).join(' / ');
}
function svg(d, s = 20, w = 2.4) { return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`; }
const P = { plus: 'M12 5v14M5 12h14', minus: 'M5 12h14', back: 'M15 5l-7 7 7 7', chev: 'M9 5l7 7-7 7', up: 'M6 15l6-6 6 6', down: 'M6 9l6 6 6-6', close: 'M6 6l12 12M18 6L6 18', note: 'M5 4h14v12H9l-4 4z', swap: 'M4 8h13l-3-3M20 16H7l3 3', check: 'M5 12.5l4.5 4.5L19 7.5' };
const I = {
  check: svg(P.check, 18, 3),
  more: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
};
const timer = w => `<span data-timer="${w.startedAt}">${fmtClock(db.now - w.startedAt)}</span>`;
const exNote = ex => ex.note ? `<div class="exnote">${svg(P.note, 14, 2)}<span>${esc(ex.note)}</span></div>` : '';
function navBar(left, title, right) { return `<header class="nav"><div class="nav-l">${left}</div><div class="nav-t">${title}</div><div class="nav-r">${right}</div></header>`; }
const cancelBtn = '<button class="navbtn" data-a="editCancel">Cancel</button>';
const doneBtn = '<button class="navbtn strong" data-a="editDone">Done</button>';
const finishBtn = '<button class="pillbtn" data-a="finish">Finish</button>';
const editTitle = '<span class="nav-edit">Editing Workout</span>';
function editBanner(w, withMeta) {
  return `<div class="editbar">
    <div class="eb-row"><span class="eb-tag">Editing</span><span>${fmtDate(w.startedAt)}</span></div>
    <div class="eb-times">
      <label class="eb-f"><span>Start</span><input id="eb-start" type="datetime-local" data-bind="w:startedAt" value="${toInput(w.startedAt)}"></label>
      <label class="eb-f"><span>End</span><input id="eb-end" type="datetime-local" data-bind="w:endedAt" value="${toInput(w.endedAt)}"></label>
    </div>
    ${withMeta ? `<input id="eb-name" class="field" data-bind="w:name" placeholder="Workout name" value="${esc(w.name)}"><textarea id="eb-note" class="field" data-bind="w:note" rows="1" placeholder="Workout note">${esc(w.note)}</textarea>` : ''}
    <div class="eb-hint">Sets you add count as completed, with time unknown. Nothing is saved until you tap Done.</div>
  </div>`;
}
function stepper(label, unitTxt, eid, sid, f, val, step, mode, cls = '') {
  const a = `data-e="${eid}" data-s="${sid}" data-f="${f}"`;
  return `<div class="stp ${cls}"><div class="stp-l">${label}${unitTxt ? ` <span>${unitTxt}</span>` : ''}</div>
    <div class="stp-c"><button class="stp-b" data-a="step" ${a} data-d="${-step}" aria-label="Decrease ${label}">${svg(P.minus)}</button>
    <input id="st-${f}-${sid}" class="stp-in" inputmode="${mode}" data-bind="s:${eid}:${sid}:${f}" value="${val}" aria-label="${label}">
    <button class="stp-b" data-a="step" ${a} data-d="${step}" aria-label="Increase ${label}">${svg(P.plus)}</button></div></div>`;
}
function rirChips(eid, sid, cur) {
  return `<div class="rir a-rirrow"><span class="rir-q">Reps in reserve</span>${[0, 1, 2, 3, 4].map(v => `<button class="chip ${cur === v ? 'on' : ''}" data-a="rir" data-e="${eid}" data-s="${sid}" data-v="${v}">${rirTxt(v)}</button>`).join('')}</div>`;
}
function segRir(eid, sid, cur) {
  return `<div class="seg">${[0, 1, 2, 3, 4].map(v => `<button class="${cur === v ? 'on' : ''}" data-a="rir" data-e="${eid}" data-s="${sid}" data-v="${v}">${rirTxt(v)}</button>`).join('')}</div>`;
}
function ring(d, n) {
  const r = 13, c = 2 * Math.PI * r, f = n ? d / n : 0;
  return `<span class="ring"><svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="3"/>${d ? `<circle cx="16" cy="16" r="${r}" fill="none" style="stroke:var(--done)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 16 16)"/>` : ''}</svg><b>${d}</b></span>`;
}

/* =====================================================================
   Variant A: Inline list. The whole Workout on one scroll, Sets as rows.

      ${e.sets.map((s, i) => VA.row(ex, e, s, lb[i], edit)).join('') || `<div class="a-empty">No Sets. This Exercise is removed on ${edit ? 'Done' : 'Finish'}.</div>`}

      : `<input id="r-${s.id}" class="a-in" inputmode="numeric" ${b('reps')} value="${s.reps}" aria-label="Reps">`;
    const ids = `data-e="${e.id}" data-s="${s.id}"`;
    return `<div class="a-set">
      <div class="swipe ${ui.A.revealed === s.id ? 'revealed' : ''}" data-swipe="${s.id}">

/* =====================================================================
   Variant B: Drill-down. Workout overview, then an Entry screen, then a Set sheet.

    </div>`;

      <span class="b-rbtns"><button class="iconbtn" data-a="moveEntry" data-e="${e.id}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${svg(P.up)}</button><button class="iconbtn" data-a="moveEntry" data-e="${e.id}" data-d="1" ${i === w.entries.length - 1 ? 'disabled' : ''} aria-label="Move down">${svg(P.down)}</button></span></div>`;

        <div class="b-group">
          ${e.sets.map((s, k) => VB.setRow(ex, e, s, lb[k], k, edit)).join('') || `<div class="b-emptyrow">No Sets. Removed on ${edit ? 'Done' : 'Finish'}.</div>`}

      <div class="b-srow col"><span>Reps in reserve</span>${segRir(e.id, s.id, s.rir)}</div>
      <input id="bs-note-${s.id}" class="field" data-bind="s:${e.id}:${s.id}:note" placeholder="Set note" value="${esc(s.note)}">
      <div class="sh-actions">
        ${edit ? '<button class="btn primary" data-a="closeOverlay">Close</button>'
          : target ? `<button class="btn primary done" data-a="B.complete" ${ids}>${I.check} Complete Set</button>`
          : `<button class="btn" data-a="uncomplete" ${ids}>Undo completion</button><button class="btn primary" data-a="closeOverlay">Close</button>`}

/* =====================================================================
   Variant C: Focus. One Set at a time with big controls; Exercises in a pager.
   ===================================================================== */
const VC = {
  name: 'Focus',
  cur(w) {
    const u = ui.C;
    let e = M.entry(w, u.entryId);
    if (!e) { e = w.entries.find(x => x.sets.some(s => M.isTarget(db, s))) || w.entries.at(-1) || null; u.entryId = e ? e.id : null; u.setId = null; }
    if (!e) return {};

/* =====================================================================
   Shared overlays: alerts, action sheets, Exercise picker, Finish sheet
   ===================================================================== */
function ask(title, message, buttons) { ui.overlay = { type: 'alert', title, message, buttons }; }
function menu(title, buttons) { const b = buttons.filter(Boolean); b.push({ label: 'Cancel', style: 'cancel' }); ui.overlay = { type: 'sheet', title, buttons: b }; }
function renderOverlay() {
  const o = ui.overlay; if (!o) return '';
  let inner, pos = 'bottom';
  if (o.type === 'alert') {
    pos = 'center';
    const n = o.buttons.length;
    inner = `<div class="alert" role="alertdialog" aria-label="${esc(o.title)}"><div class="al-t">${esc(o.title)}</div>${o.message ? `<div class="al-m">${esc(o.message)}</div>` : ''}
      <div class="al-btns ${n === 1 ? 'one' : n > 2 ? 'stack' : ''}">${o.buttons.map((b, i) => `<button class="al-b ${b.style || ''}" data-a="dlg" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
  } else if (o.type === 'sheet') {
    const ci = o.buttons.length - 1;
    inner = `<div class="actsheet"><div class="as-group">${o.title ? `<div class="as-t">${esc(o.title)}</div>` : ''}${o.buttons.slice(0, ci).map((b, i) => `<button class="as-b ${b.style || ''}" data-a="dlg" data-i="${i}">${esc(b.label)}</button>`).join('')}</div><button class="as-b as-cancel" data-a="dlg" data-i="${ci}">Cancel</button></div>`;
  } else if (o.type === 'picker') inner = renderPicker(o);
  else if (o.type === 'finish') inner = renderFinish(o);
  else inner = o.render();
  if (!ui.overlay) return '';
  return `<div class="ov ${pos}"><div class="scrim" ${o.type === 'alert' ? '' : 'data-a="closeOverlay"'}></div>${inner}</div>`;
}
function renderPicker(o) {
  const w = M.working(db);
  const title = o.mode === 'add' ? 'Add Exercise' : 'Swap ' + esc(M.ex(db, M.entry(w, o.entryId).exerciseId).name);
  return `<div class="sheet tall"><div class="sh-head"><div class="sh-title">${title}</div><button class="iconbtn" data-a="closeOverlay" aria-label="Close">${svg(P.close)}</button></div>
    ${o.mode === 'swap' ? '<div class="sh-sub">Only Exercises with the same Load Type, sides and weight convention are shown.</div>' : ''}
    <input id="pickq" class="pk-q" type="search" data-bind="q" placeholder="Search Exercises" value="${esc(o.q)}" autocomplete="off">
    <div id="picklist" class="pk-list">${pickList(o)}</div></div>`;
}
function pickList(o) {
  const w = M.working(db), inW = new Set(w.entries.map(e => e.exerciseId)), q = o.q.trim().toLowerCase();
  let pool = db.exercises.filter(x => !x.archived);
  if (o.mode === 'swap') { const cur = M.ex(db, M.entry(w, o.entryId).exerciseId); pool = pool.filter(x => M.compatible(cur, x)); }
  if (q) pool = pool.filter(x => x.name.toLowerCase().includes(q));
  const row = x => {
    const lp = M.lastPerformance(db, x.id);
    const tag = inW.has(x.id) ? `<span class="pk-tag">${o.mode === 'add' ? 'In Workout' : 'Combines'}</span>` : '';
    return `<button class="pk-row" data-a="pick" data-x="${x.id}"><span class="pk-main"><span class="pk-name">${esc(x.name)}</span><span class="pk-meta">${lp ? 'Last ' + fmtDate(lp.workout.startedAt) + ': ' + esc(compact(x, lp.sets)) : x.equipment + ' - no history'}</span></span>${tag}</button>`;
  };
  if (q || o.mode === 'swap') return pool.map(row).join('') || '<div class="pk-none">No matching Exercises</div>';
  const inList = pool.filter(x => inW.has(x.id));
  const recentIds = [...new Set(M.finishedWorkouts(db).flatMap(fw => fw.entries.map(e => e.exerciseId)))].filter(id => !inW.has(id)).slice(0, 8);
  const recent = recentIds.map(id => M.ex(db, id)).filter(Boolean);
  const rest = pool.filter(x => !inW.has(x.id) && !recentIds.includes(x.id)).sort((a, b) => a.name.localeCompare(b.name));
  return (inList.length ? '<div class="pk-sec">In this Workout</div>' + inList.map(row).join('') : '')
    + (recent.length ? '<div class="pk-sec">Recent</div>' + recent.map(row).join('') : '')
    + '<div class="pk-sec">All Exercises</div>' + rest.map(row).join('');
}
function renderFinish(o) {
  const w = M.active(db), c = M.finishCheck(db);
  const endAt = c.needsEndPrompt && o.endChoice === 'last' ? c.lastAt : db.now;
  const names = c.dropped.map(e => M.ex(db, e.exerciseId).name);
  const seg = (k, t) => `<button class="${o.endChoice === k ? 'on' : ''}" data-a="endChoice" data-c="${k}">${t}</button>`;
  return `<div class="sheet"><div class="sh-head"><div class="sh-title">Finish Workout</div><button class="iconbtn" data-a="closeOverlay" aria-label="Close">${svg(P.close)}</button></div>
    <div class="fin-stats"><div><b>${fmtDur(endAt - w.startedAt)}</b><span>${fmtTime(w.startedAt)} to ${fmtTime(endAt)}</span></div><div><b>${c.exercises}</b><span>Exercises</span></div><div><b>${c.completed}</b><span>Sets</span></div></div>
    ${c.targets ? `<div class="fin-warn">${c.targets} target ${c.targets === 1 ? 'Set' : 'Sets'} not completed will be removed.</div>` : ''}
    ${names.length ? `<div class="fin-warn">${esc(names.join(', '))} ${names.length === 1 ? 'has' : 'have'} no completed Sets and will be removed.</div>` : ''}
    ${c.needsEndPrompt ? `<div class="fin-end"><div>Your last Set was at ${fmtTime(c.lastAt)}, ${fmtDur(db.now - c.lastAt)} ago. End the Workout at:</div><div class="seg">${seg('last', 'Last Set ' + fmtTime(c.lastAt))}${seg('now', 'Now ' + fmtTime(db.now))}</div></div>` : ''}
    <div class="sh-actions"><button class="btn primary done" data-a="finishConfirm">Finish Workout</button><button class="btn" data-a="closeOverlay">Keep Logging</button></div>
    <div class="fin-fine">Saved to history and written to Health as a strength training workout.</div></div>`;
}

/* =====================================================================
   Flows and handlers
   ===================================================================== */
const VARIANTS = { A: VA, B: VB, C: VC }, VKEYS = ['A', 'B', 'C'];
let db = buildDb('mid');
const freshNav = () => ({ A: { reorder: false, revealed: null, rirFor: null }, B: { route: 'overview', entryId: null, editList: false }, C: { entryId: null, setId: null, rirPending: null } });
let ui = { variant: readVariant(), screen: 'log', detailId: null, overlay: null, toast: null, flash: null, focus: null, scrollTo: null, resetScroll: null, toolsOpen: false, noteOpen: {}, ...freshNav() };

function mut(fn) { const d = structuredClone(db); const r = fn(d); db = d; return r; }
function resetNav() { Object.assign(ui, freshNav()); ui.noteOpen = {}; }
function toast(t) { ui.toast = t; clearTimeout(toast.h); toast.h = setTimeout(() => { ui.toast = null; document.getElementById('toast').innerHTML = ''; }, 2800); }
function goToEntry(eid) {
  ui.flash = eid;
  ui.A.reorder = false;
  ui.B.route = 'entry'; ui.B.entryId = eid; ui.B.editList = false;
  ui.C.entryId = eid; ui.C.setId = null; ui.C.rirPending = null;
  ui.scrollTo = ui.variant === 'A' ? 'entry-' + eid : ui.variant === 'C' ? 'chip-' + eid : null;
  if (ui.variant === 'C') ui.resetScroll = 'scroll-C';
}
function removeEntryFlow(eid) {
  const e = M.entry(M.working(db), eid), ex = M.ex(db, e.exerciseId), done = e.sets.filter(s => !M.isTarget(db, s)).length;
  const go = () => { mut(x => M.removeEntry(x, eid)); if (ui.B.entryId === eid) ui.B.route = 'overview'; toast('Removed ' + ex.name); };
  if (done) ask('Remove ' + ex.name + '?', 'Its ' + done + ' completed ' + (done === 1 ? 'Set' : 'Sets') + ' will be deleted.', [{ label: 'Cancel', style: 'cancel' }, { label: 'Remove', style: 'destructive', fn: go }]);
  else go();
}
function doDiscard() { mut(x => M.discard(x)); resetNav(); ui.screen = 'log'; toast('Workout discarded'); }
function afterEdit() { resetNav(); ui.screen = db.workouts.some(w => w.id === ui.detailId && w.endedAt != null) ? 'detail' : 'log'; }

const H = {
  variant: d => setVariant(d.v),
  prevV: () => setVariant(VKEYS[(VKEYS.indexOf(ui.variant) + 2) % 3]),
  nextV: () => setVariant(VKEYS[(VKEYS.indexOf(ui.variant) + 1) % 3]),
  tools: () => { ui.toolsOpen = !ui.toolsOpen; },
  start() { mut(x => M.start(x)); resetNav(); ui.screen = 'log'; },
  openAdd() { ui.overlay = { type: 'picker', mode: 'add', q: '' }; },
  swapOpen: d => { ui.overlay = { type: 'picker', mode: 'swap', entryId: d.e, q: '' }; },
  pick(d) {
    const o = ui.overlay, w = M.working(db), to = M.ex(db, d.x);
    ui.overlay = null;
    if (o.mode === 'add') {
      const r = mut(x => M.addExercise(x, d.x));
      goToEntry(r.entryId);
      if (r.existed) toast(to.name + ' is already in this Workout');
      else if (!r.prefilled && !db.edit) toast('No Last Performance for ' + to.name + '. Started with one empty Set.');
      return;
    }
    const from = M.ex(db, M.entry(w, o.entryId).exerciseId);
    const go = () => { const r = mut(x => M.swap(x, o.entryId, to.id)); goToEntry(r.entryId); toast(r.combined ? 'Combined into ' + to.name : 'Swapped to ' + to.name); };
    if (w.entries.some(x => x.exerciseId === to.id)) ask('Combine with ' + to.name + '?', to.name + ' is already in this Workout. Its Entry keeps the earlier position, the Sets from ' + from.name + ' are added after its own, and the notes are joined.', [{ label: 'Cancel', style: 'cancel' }, { label: 'Combine', style: 'strong', fn: go }]);
    else go();
  },
  closeOverlay() { ui.overlay = null; },
  dlg(d) { const b = ui.overlay.buttons[+d.i]; ui.overlay = null; if (b.fn) b.fn(); },
  finish() {
    const c = M.finishCheck(db);
    if (!c.completed) { ask('Discard this Workout?', 'No Sets are completed, so there is nothing to save. The Workout is deleted.', [{ label: 'Keep Logging', style: 'cancel' }, { label: 'Discard', style: 'destructive', fn: doDiscard }]); return; }
    ui.overlay = { type: 'finish', endChoice: 'last' };
  },
  endChoice: d => { ui.overlay.endChoice = d.c; },
  finishConfirm() {
    const c = M.finishCheck(db), w = M.active(db), endAt = c.needsEndPrompt && ui.overlay.endChoice === 'last' ? c.lastAt : db.now;
    mut(x => M.finish(x, endAt));
    ui.overlay = null; resetNav(); ui.screen = 'log';
    toast('Workout saved, ' + fmtTime(w.startedAt) + ' to ' + fmtTime(endAt) + '. Written to Health.');
  },
  discard() {
    const n = setCount(M.active(db));
    ask('Discard Workout?', (n ? 'This deletes the Workout and its ' + n + ' Sets. ' : '') + 'Nothing is saved to history or Health.', [{ label: 'Cancel', style: 'cancel' }, { label: 'Discard', style: 'destructive', fn: doDiscard }]);
  },
  toggle(d) {
    const s = M.findSet(db, d.e, d.s);
    if (M.isTarget(db, s)) { mut(x => M.complete(x, d.e, d.s)); ui.A.rirFor = d.s; }
    else { mut(x => M.uncomplete(x, d.e, d.s)); if (ui.A.rirFor === d.s) ui.A.rirFor = null; }
  },
  uncomplete: d => mut(x => M.uncomplete(x, d.e, d.s)),
  rir(d) { const s = M.findSet(db, d.e, d.s), v = +d.v; mut(x => M.setField(x, d.e, d.s, 'rir', s.rir === v ? null : v)); ui.A.rirFor = null; },
  addSet(d) { ui.flash = mut(x => M.addSet(x, d.e)); },
  delSet(d) { mut(x => M.removeSet(x, d.e, d.s)); ui.A.revealed = null; if (ui.overlay && ui.overlay.type === 'custom') ui.overlay = null; },
  moveEntry: d => mut(x => M.moveEntry(x, d.e, +d.d)),
  moveSet: d => mut(x => M.moveSet(x, d.e, d.s, +d.d)),
  removeEntry: d => removeEntryFlow(d.e),
  toggleWarm(d) { const s = M.findSet(db, d.e, d.s); mut(x => M.setField(x, d.e, d.s, 'isWarmUp', !s.isWarmUp)); },
  step: d => mut(x => M.step(x, d.e, d.s, d.f, +d.d)),
  editCancel() {
    if (!M.editChanged(db)) { mut(x => M.cancelEdit(x)); afterEdit(); return; }
    ask('Discard your changes?', 'Nothing you changed in this Workout will be saved.', [{ label: 'Keep Editing', style: 'cancel' }, { label: 'Discard', style: 'destructive', fn: () => { mut(x => M.cancelEdit(x)); afterEdit(); } }]);
  },
  editDone() {
    const r = M.editDoneCheck(db);
    if (r.error === 'overlap') ask('Overlaps ' + M.label(db, r.other), 'That Workout ran ' + fmtDate(r.other.startedAt) + ', ' + fmtTime(r.other.startedAt) + ' to ' + (r.other.endedAt ? fmtTime(r.other.endedAt) : 'now') + '. Change the start or end time so they don\'t overlap.', [{ label: 'OK', style: 'strong' }]);
    else if (r.error) ask("Can't save these times", r.error, [{ label: 'OK', style: 'strong' }]);
    else if (r.empty) ask('Delete this Workout?', 'You removed every Set, so saving would leave an empty Workout. It is deleted instead, from history and from Health.', [{ label: 'Keep Editing', style: 'cancel' }, { label: 'Delete', style: 'destructive', fn: () => { mut(x => M.deleteWorkout(x, x.edit.draft.id)); resetNav(); ui.screen = 'log'; toast('Workout deleted'); } }]);
    else { const res = mut(x => M.commitEdit(x)); afterEdit(); toast(res.timesChanged ? 'Saved. Health workout updated with the new times.' : 'Saved'); }
  },
  openDetail(d) { if (db.edit) mut(x => M.cancelEdit(x)); ui.overlay = null; ui.screen = 'detail'; ui.detailId = d.w; ui.toolsOpen = false; },
  back() { ui.screen = 'log'; },
  beginEdit(d) { mut(x => M.beginEdit(x, d.w)); resetNav(); },
  deleteWorkout(d) { ask('Delete this Workout?', "It's removed from history and from Health. This can't be undone.", [{ label: 'Cancel', style: 'cancel' }, { label: 'Delete', style: 'destructive', fn: () => { mut(x => M.deleteWorkout(x, d.w)); ui.screen = 'log'; toast('Workout deleted'); } }]); },
  tick(d) { db.now += +d.m * MIN; },
  reopen() {
    db.now += 4 * 60 * MIN; ui.overlay = null; ui.toolsOpen = false; ui.screen = 'log';
    const st = M.staleCheck(db);
    if (!st) { toast('Reopened 4 h later. No Active Workout to check.'); return; }
    const c = M.finishCheck(db);
    if (!st.lastAt) { ask('Workout still open', 'You started it at ' + fmtTime(st.ref) + ', ' + fmtDur(db.now - st.ref) + ' ago, and completed no Sets.', [{ label: 'Resume', style: 'strong' }, { label: 'Discard', style: 'destructive', fn: H.discard }]); return; }
    ask('Workout still open', 'Your last Set was at ' + fmtTime(st.lastAt) + ', ' + fmtDur(db.now - st.lastAt) + ' ago.' + (c.targets ? ' Finishing removes ' + c.targets + ' target ' + (c.targets === 1 ? 'Set' : 'Sets') + ' not completed.' : ''), [
      { label: 'Finish at ' + fmtTime(st.lastAt), style: 'strong', fn: () => { mut(x => M.finish(x, st.lastAt)); resetNav(); toast('Workout saved, ended at ' + fmtTime(st.lastAt) + '.'); } },
      { label: 'Resume' },
      { label: 'Discard', style: 'destructive', fn: H.discard },
    ]);
  },
  scenario(d) { db = buildDb(d.v); resetNav(); ui.screen = 'log'; ui.overlay = null; ui.toolsOpen = false; },

  'A.reorder'() { ui.A.reorder = !ui.A.reorder; },
  'A.rirToggle'(d) { ui.A.rirFor = ui.A.rirFor === d.s ? null : d.s; },
  'A.setMenu'(d) {
    const e = M.entry(M.working(db), d.e), s = e.sets.find(x => x.id === d.s), ex = M.ex(db, e.exerciseId), i = e.sets.indexOf(s), l = labels(e)[i];
    menu((l === 'W' ? 'Warm-up' : 'Set ' + l) + ': ' + setTxt(ex, s), [
      { label: s.isWarmUp ? 'Mark as working Set' : 'Mark as warm-up', fn: () => mut(x => M.setField(x, d.e, d.s, 'isWarmUp', !s.isWarmUp)) },
      { label: s.note ? 'Edit note' : 'Add note', fn: () => { ui.noteOpen['s' + d.s] = true; ui.focus = 'sn-' + d.s; } },
      i > 0 && { label: 'Move up', fn: () => mut(x => M.moveSet(x, d.e, d.s, -1)) },
      i < e.sets.length - 1 && { label: 'Move down', fn: () => mut(x => M.moveSet(x, d.e, d.s, 1)) },
      { label: 'Delete Set', style: 'destructive', fn: () => mut(x => M.removeSet(x, d.e, d.s)) },
    ]);
  },
  'A.entryMenu'(d) {
    const e = M.entry(M.working(db), d.e), ex = M.ex(db, e.exerciseId);
    menu(ex.name, [
      { label: e.note || ui.noteOpen['e' + d.e] ? 'Edit note' : 'Add note', fn: () => { ui.noteOpen['e' + d.e] = true; ui.focus = 'en-' + d.e; } },
      { label: 'Reorder Exercises', fn: () => { ui.A.reorder = true; } },
      db.edit && { label: 'Swap Exercise', fn: () => H.swapOpen(d) },
      { label: 'Remove Exercise', style: 'destructive', fn: () => removeEntryFlow(d.e) },
    ]);
  },
  'B.open'(d) { ui.B.route = 'entry'; ui.B.entryId = d.e; ui.B.editList = false; },
  'B.back'() { ui.B.route = 'overview'; ui.B.editList = false; },
  'B.editList'() { ui.B.editList = !ui.B.editList; },
  'B.sheet'(d) { ui.overlay = { type: 'custom', render: VB.sheet, e: d.e, s: d.s }; },
  'B.complete'(d) { mut(x => M.complete(x, d.e, d.s)); ui.overlay = null; ui.flash = d.s; },
  'C.entry'(d) { ui.C.entryId = d.e; ui.C.setId = null; ui.C.rirPending = null; ui.resetScroll = 'scroll-C'; ui.scrollTo = 'chip-' + d.e; },
  'C.set'(d) { ui.C.setId = d.s; ui.C.rirPending = null; },
  'C.complete'(d) { mut(x => M.complete(x, d.e, d.s)); ui.C.rirPending = d.s; },
  'C.rir'(d) { if (d.v !== 'skip') mut(x => M.setField(x, d.e, d.s, 'rir', +d.v)); ui.C.rirPending = null; ui.C.setId = null; },
  'C.rirEdit'(d) { ui.C.setId = d.s; ui.C.rirPending = d.s; },
  'C.next'(d) {
    const e = M.entry(M.working(db), d.e), k = e.sets.findIndex(s => s.id === ui.C.setId);
    ui.C.setId = db.edit ? (e.sets[k + 1] || e.sets[k] || {}).id || null : null;
  },
  'C.addSet'(d) { const sid = mut(x => M.addSet(x, d.e)); ui.C.setId = sid; ui.C.rirPending = null; ui.flash = sid; },
  'C.setNote'(d) { ui.noteOpen['s' + d.s] = true; ui.focus = 'sn-' + d.s; },
  'C.wkMenu'() {
    menu('Workout', [
      { label: 'Workout name and note', fn: () => { ui.overlay = { type: 'custom', render: VC.metaSheet }; } },
      { label: 'Discard Workout', style: 'destructive', fn: H.discard },
    ]);
  },
  'C.menu'(d) {
    const w = M.working(db), e = M.entry(w, d.e), ex = M.ex(db, e.exerciseId), i = w.entries.indexOf(e), { s } = VC.cur(w), k = s ? e.sets.indexOf(s) : -1;
    menu(ex.name, [
      { label: e.note || ui.noteOpen['e' + e.id] ? 'Edit note' : 'Add note', fn: () => { ui.noteOpen['e' + e.id] = true; ui.focus = 'en-' + e.id; } },
      s && k > 0 && { label: 'Move this Set up', fn: () => mut(x => M.moveSet(x, e.id, s.id, -1)) },
      s && k < e.sets.length - 1 && { label: 'Move this Set down', fn: () => mut(x => M.moveSet(x, e.id, s.id, 1)) },
      i > 0 && { label: 'Move Exercise earlier', fn: () => mut(x => M.moveEntry(x, e.id, -1)) },
      i < w.entries.length - 1 && { label: 'Move Exercise later', fn: () => mut(x => M.moveEntry(x, e.id, 1)) },
      db.edit && { label: 'Swap Exercise', fn: () => H.swapOpen({ e: e.id }) },
      s && { label: 'Delete this Set', style: 'destructive', fn: () => { mut(x => M.removeSet(x, e.id, s.id)); ui.C.setId = null; } },
      { label: 'Remove Exercise', style: 'destructive', fn: () => removeEntryFlow(e.id) },
    ]);
  },
};

/* =====================================================================
   Rendering, variant switching, input binding, swipe
   ===================================================================== */
const appEl = document.getElementById('app'), ovEl = document.getElementById('overlay'), toastEl = document.getElementById('toast'), toolsEl = document.getElementById('tools'), barEl = document.getElementById('protobar');
const scrollMem = {};

function readVariant() {
  let v = null;
  try { v = new URLSearchParams(location.search).get('variant'); } catch (e) {}
  if (!v) v = (location.hash || '').slice(1);
  v = (v || '').toUpperCase();
  return VKEYS.includes(v) ? v : 'A';
}
function setVariant(v) {
  ui.variant = v; ui.overlay = null;
  try {
    const u = new URL(location.href);
    if (u.searchParams.has('variant')) { u.searchParams.set('variant', v); history.replaceState(null, '', u); }
    else history.replaceState(null, '', '#' + v);
  } catch (e) {}
}

function render() {
  document.querySelectorAll('[data-keep]').forEach(el => { scrollMem[el.id] = [el.scrollTop, el.scrollLeft]; });
  const detail = ui.screen === 'detail' && db.workouts.find(w => w.id === ui.detailId && w.endedAt != null);
  if (db.edit) appEl.innerHTML = VARIANTS[ui.variant].render(true);
  else if (detail) appEl.innerHTML = renderDetail(detail);
  else if (M.active(db)) appEl.innerHTML = VARIANTS[ui.variant].render(false);
  else appEl.innerHTML = renderHome();
  ovEl.innerHTML = renderOverlay();
  toastEl.innerHTML = ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : '';
  document.querySelectorAll('[data-keep]').forEach(el => { const m = scrollMem[el.id]; if (m) { el.scrollTop = m[0]; el.scrollLeft = m[1]; } });
  if (ui.resetScroll) { const el = document.getElementById(ui.resetScroll); if (el) el.scrollTop = 0; ui.resetScroll = null; }
  if (ui.scrollTo) {
    const el = document.getElementById(ui.scrollTo);
    const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (el) el.scrollIntoView({ block: ui.scrollTo.startsWith('chip') ? 'nearest' : 'start', inline: 'center', behavior: smooth ? 'smooth' : 'auto' });
    ui.scrollTo = null;
  }
  if (ui.focus) { const el = document.getElementById(ui.focus); if (el) el.focus(); ui.focus = null; }
  ui.flash = null;
  renderTools();
  barEl.innerHTML = `<button data-a="prevV" aria-label="Previous layout">${svg(P.back, 18)}</button><span class="pb-lbl">${ui.variant}  ${VARIANTS[ui.variant].name}</span><button data-a="nextV" aria-label="Next layout">${svg(P.chev, 18)}</button><button class="pb-tools" data-a="tools">${ui.toolsOpen ? 'Close' : 'Tools'}</button>`;
  toolsEl.classList.toggle('open', ui.toolsOpen);
}

function stateView() {
  const w = M.working(db);
  if (!w) return `<div class="t-muted">No Active Workout. ${M.finishedWorkouts(db).length} finished Workouts.</div>`;
  const head = db.edit ? 'Editing, unsaved draft: ' + M.label(db, w) : 'Active Workout: ' + (w.name || 'unnamed');
  return `<div class="t-state"><div class="t-en">${esc(head)}</div>
    <div>Start ${fmtDate(w.startedAt)} ${fmtTime(w.startedAt)}, end ${w.endedAt ? fmtTime(w.endedAt) : 'empty (active)'}</div>
    ${w.note ? `<div>Note: ${esc(w.note)}</div>` : ''}
    ${w.entries.map((e, i) => { const ex = M.ex(db, e.exerciseId), lb = labels(e); return `<div class="t-entry"><div class="t-en">${i + 1}. ${esc(ex.name)}</div>${e.note ? `<div>Entry note: ${esc(e.note)}</div>` : ''}
      ${e.sets.map((s, k) => `<div class="t-set ${M.isTarget(db, s) ? 'tg' : ''}"><span>${lb[k]}</span><span>${esc(setTxt(ex, s))}</span><span>${s.rir != null ? 'RIR ' + rirTxt(s.rir) : ''}</span><span class="t-st">${M.isTarget(db, s) ? 'target' : s.completedAt ? 'completed ' + fmtTime(s.completedAt) : 'completed, time unknown'}${s.note ? ', note: ' + esc(s.note) : ''}</span></div>`).join('') || '<div class="t-muted">no Sets</div>'}</div>`; }).join('') || '<div class="t-muted">No Exercise Entries</div>'}
  </div>`;
}
function renderTools() {
  const fin = M.finishedWorkouts(db);
  toolsEl.innerHTML = `<div class="t-kicker">Prototype for LogNLoad #12</div><div class="t-q">How does the logging screen flow?</div>
    <p class="t-p">Three layouts over the same Workout. Switch with the bar or the arrow keys. Everything lives in memory: reload to start over.</p>
    <div class="t-sec"><div class="t-h">Layout</div><div class="t-btns">${VKEYS.map(k => `<button class="${ui.variant === k ? 'on' : ''}" data-a="variant" data-v="${k}">${k} ${VARIANTS[k].name}</button>`).join('')}</div></div>
    <div class="t-sec"><div class="t-h"><span>Clock</span><span id="t-clock">${fmtDate(db.now)} ${fmtTime(db.now)}</span></div>
      <div class="t-btns"><button data-a="tick" data-m="1">+1 min</button><button data-a="tick" data-m="5">+5 min</button><button data-a="tick" data-m="20">+20 min</button><button data-a="reopen">Reopen app 4 h later</button></div>
      <div class="t-muted">+20 min, then Finish: end-time question. Reopen: stale Workout prompt.</div></div>
    <div class="t-sec"><div class="t-h">Start over</div><div class="t-btns"><button data-a="scenario" data-v="mid">Mid-Workout</button><button data-a="scenario" data-v="none">No Active Workout</button></div></div>
    <div class="t-sec"><div class="t-h">Edit a finished Workout</div><div class="t-list">${fin.map(w => `<button data-a="openDetail" data-w="${w.id}">${esc(M.label(db, w))}<span>${fmtDate(w.startedAt)} ${fmtTime(w.startedAt)}</span></button>`).join('') || '<div class="t-muted">None</div>'}</div>
      <div class="t-muted">Try moving Push's start to 07:30 on Thu: it overlaps Arms.</div></div>
    <div class="t-sec"><div class="t-h">State</div>${stateView()}</div>
    <div class="t-sec"><div class="t-h">Health writes</div>${db.health.length ? db.health.map(h => `<div>${esc(h)}</div>`).join('') : '<div class="t-muted">None yet</div>'}</div>`;
}

let suppressClick = false;
document.addEventListener('click', ev => {
  if (suppressClick) { suppressClick = false; ev.preventDefault(); return; }
  const el = ev.target.closest('[data-a]');
  const a = el && el.dataset.a;
  if (ui.A.revealed && a !== 'delSet') { ui.A.revealed = null; if (!a) { render(); return; } }
  if (!a || !H[a]) return;
  ev.preventDefault();
  H[a](el.dataset);
  render();
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (t.closest && t.closest('input,textarea,[contenteditable]')) return;
  if ((ev.key === 'Enter' || ev.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button') { ev.preventDefault(); t.click(); return; }
  if (ev.key === 'ArrowLeft') { H.prevV(); render(); }
  if (ev.key === 'ArrowRight') { H.nextV(); render(); }
});
window.addEventListener('hashchange', () => { const v = readVariant(); if (v !== ui.variant) { ui.variant = v; render(); } });

// Typing updates the model without re-rendering, so focus and the keyboard stay put.
document.addEventListener('input', ev => {
  const b = ev.target.dataset && ev.target.dataset.bind; if (!b) return;
  const [kind, ...rest] = b.split(':'), v = ev.target.value;
  if (kind === 'q') { ui.overlay.q = v; document.getElementById('picklist').innerHTML = pickList(ui.overlay); return; }
  if (kind === 's') {
    const [eid, sid, f] = rest; let val = v;
    if (f === 'weight') { val = parseFloat(v.replace(',', '.')); if (isNaN(val)) return; val = Math.max(0, Math.round(val * 100) / 100); }
    else if (f !== 'note') { val = parseInt(v, 10); if (isNaN(val)) return; val = Math.max(0, val); }
    mut(x => M.setField(x, eid, sid, f, val));
  } else if (kind === 'e') mut(x => M.entryNote(x, rest[0], v));
  else if (kind === 'w') {
    const f = rest[0]; let val = v;
    if (f === 'startedAt' || f === 'endedAt') { val = new Date(v).getTime(); if (isNaN(val)) return; }
    mut(x => M.workoutField(x, f, val));
  }
  renderTools();
});

// Variant A: swipe a Set row left to reveal Delete.
let sw = null;
document.addEventListener('pointerdown', ev => {
  const row = ev.target.closest('[data-swipe]');
  sw = row && !ev.target.closest('input,.swipe-del') ? { id: row.dataset.swipe, x: ev.clientX, y: ev.clientY, dx: 0, on: false, base: row.classList.contains('revealed') ? -88 : 0, inner: row.querySelector('.a-row') } : null;
});
document.addEventListener('pointermove', ev => {
  if (!sw) return;
  const dx = ev.clientX - sw.x, dy = ev.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { sw.on = true; sw.inner.style.transition = 'none'; }
    else if (Math.abs(dy) > 10) { sw = null; return; }
    else return;
  }
  sw.dx = dx;
  sw.inner.style.transform = `translateX(${Math.max(-140, Math.min(0, sw.base + dx))}px)`;
});
document.addEventListener('pointerup', () => {
  if (!sw) return;
  const s = sw; sw = null;
  if (!s.on) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  ui.A.revealed = s.base + s.dx < -44 ? s.id : null;
  render();
});
document.addEventListener('pointercancel', () => { if (sw) { sw.inner.style.transform = ''; sw = null; } });

// The clock runs in real time; the Tools panel can jump it forward.
setInterval(() => {
  db.now += 1000;
  document.querySelectorAll('[data-timer]').forEach(el => { el.textContent = fmtClock(db.now - +el.dataset.timer); });
  const c = document.getElementById('t-clock'); if (c) c.textContent = fmtDate(db.now) + ' ' + fmtTime(db.now);
}, 1000);

render();
</script>
